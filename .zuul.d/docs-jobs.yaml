- job:
    name: rally-tox-docs-rtd
    parent: openstack-tox-docs
    description: |
      Build the documentation the way Read the Docs does: ``tox -e docs``
      with ``READTHEDOCS=True``, which selects the Read the Docs theme.
      The ``openstack-tox-docs`` job covers the openstackdocs theme.
    vars:
      tox_environment:
        READTHEDOCS: "True"
      tox_skip_pdf: true

- job:
    name: rally-trigger-readthedocs
    description: "Trigger a Read the Docs build of the rally documentation."
    nodeset:
      nodes: []
    run: tests/ci/playbooks/trigger-rtd.yaml
    secrets:
      name: rtd_credentials
      secret: rally-rtd-credentials
    vars:
      rtd_project_name: rally
      rtd_webhook_id: "52691"
